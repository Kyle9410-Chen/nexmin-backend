name: API Docs Check

# Compile and format only: this catches a spec that no longer builds, never a spec
# that no longer matches the handlers.
on:
  pull_request:
    paths:
      - "docs/api/**"
      - ".github/workflows/api-docs-check.yml"

jobs:
  style-and-compile-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Style check
        run: npx tsp format --check "**/*.tsp"

      - name: Compile
        run: npx tsp compile .
