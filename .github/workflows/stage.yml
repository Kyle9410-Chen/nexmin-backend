name: Backend Stage Release

# Tag-triggered, matching clustron-backend's stage workflow.
on:
  push:
    tags:
      - "v*"

env:
  GO_VERSION: "1.26.2"
  SQLC_VERSION: "1.31.1"
  GOLANGCI_LINT_VERSION: "v2.13"

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      # The sqlc-generated files are gitignored, so nothing compiles until this runs.
      - name: Generate
        run: |
          go mod download
          make gen

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  Test:
    needs: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      - name: Test
        run: make test

  Build:
    needs: Test
    # Guarded so the pipeline stays green before the Docker Hub credentials exist.
    # DOCKER_IMAGE_ENABLED must be a *repository* variable, not one on the environment
    # below: a job-level `if` is evaluated before the environment is resolved, so an
    # environment-scoped variable reads as empty here and the job is always skipped.
    if: ${{ vars.DOCKER_IMAGE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Carries DOCKER_REGISTRY_USERNAME / DOCKER_REGISTRY_TOKEN.
    environment: docker-hub
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # No Go or sqlc setup here: the Dockerfile is self-contained and generates the
      # sqlc code in its own builder stage.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ vars.DOCKER_IMAGE || 'umineko9410/nexmin-backend' }}:stage
            ${{ vars.DOCKER_IMAGE || 'umineko9410/nexmin-backend' }}:${{ github.sha }}
