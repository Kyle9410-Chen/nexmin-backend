debug: true
host: localhost
port: "8080"
base_url: "http://localhost:8080"

# Shared HS256 key used to verify incoming JWTs. Tokens are minted out-of-band.
# Do not leave this at "default-secret": with debug false the server replaces that
# value with a random UUID at startup, which silently invalidates every externally
# minted token. Use a real secret here and something unguessable in deployments.
secret: "local-dev-secret"

database_url: "postgres://postgres:password@localhost:5432/nexmin?sslmode=disable"
migration_source: "file://internal/database/migrations"
allow_origins:
  - "http://localhost:3000"

# Where the OAuth callback sends the browser. Tokens arrive in the URL fragment:
#   {frontend_url}#accessToken=...&refreshToken=...&expiresIn=900
frontend_url: "http://localhost:3000"

# Google OAuth client (Cloud Console -> Credentials -> OAuth 2.0 Client ID, type "Web").
# The authorized redirect URI must be exactly {base_url}/api/auth/google/callback
# Env: GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET
google_oauth_client_id: ""
google_oauth_client_secret: ""

google_group:
  # Base64-encoded service account JSON key. Leave empty to run without Google
  # integration; the mailing list endpoints then return 503.
  # Generate with: base64 -w0 service-account.json
  # Env: GOOGLE_SERVICE_ACCOUNT_KEY
  service_account_key: ""

  # Workspace admin impersonated via domain-wide delegation. Required whenever
  # service_account_key is set. Env: GOOGLE_IMPERSONATE_SUBJECT
  impersonate_subject: ""

  # How long a fetched member list is reused. Env: GOOGLE_GROUP_CACHE_TTL
  cache_ttl: "5m"

  # Workspace domain the club's own groups live in. With this set, the API speaks bare
  # group names in both directions -- GET /api/groups returns "general" and
  # GET /api/groups/general/members works -- while full addresses and immutable group
  # IDs keep working. Set it empty to go back to full addresses everywhere.
  # Member addresses are never touched; those are @gmail.com, @nycu.edu.tw and so on.
  # Env: GOOGLE_GROUP_DOMAIN
  domain: "sdc.nycu.club"

  # Only active, direct members of this mailing list may sign in. Leaving it empty
  # refuses every login rather than allowing everyone. A bare name is resolved against
  # `domain` above, so "general" and "general@sdc.nycu.club" are equivalent here.
  # Env: GOOGLE_LOGIN_GROUP
  login_group: ""

# The club's Google Form response sheet. At startup, and only at startup, every member
# of `google_group.login_group` who has no local row yet gets one created from this
# sheet, so the roster shows names instead of bare addresses before anyone has signed
# in. Rows that already exist are never touched and nothing is written back.
#
# Leave spreadsheet_id empty to turn the whole thing off; the sync also needs a service
# account key and a login group, and simply does not run without any of the three.
#
# It reuses `google_group.service_account_key` above -- there is deliberately no second
# key here. Share the sheet with the *service account's own address* (Viewer); this does
# not use domain-wide delegation, so it needs no change in the Workspace admin console.
# The Sheets API must be enabled in the key's GCP project, which is separate from the
# Admin SDK being enabled there.
google_sheet:
  # From the sheet's URL: docs.google.com/spreadsheets/d/<id>/edit
  # Env: GOOGLE_SHEET_ID
  spreadsheet_id: ""

  # The tab to read. Google Forms names it after the form.
  # Env: GOOGLE_SHEET_NAME
  sheet_name: "表單回應 1"

  # Which column holds what, as spreadsheet letters. A form's layout is decided by the
  # form itself -- column A is the timestamp, column B the address when the form
  # collects one, and the answers follow in question order -- so there is no sensible
  # default and these must be set. The header row is logged at startup, which is the
  # quickest way to check they point where you think they do.
  # Env: GOOGLE_SHEET_EMAIL_COLUMN / GOOGLE_SHEET_NAME_COLUMN / GOOGLE_SHEET_NICKNAME_COLUMN
  email_column: ""
  name_column: ""
  nickname_column: ""

  # How many leading rows to skip. Cannot be 0 -- config merging reads a zero int as
  # "unset" -- which costs nothing, since a Forms sheet always has a header row.
  # Env: GOOGLE_SHEET_HEADER_ROWS
  header_rows: 1
